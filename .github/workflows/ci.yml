name: CI / CD

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

permissions:
  contents: read

jobs:
  # ── Build & Test ─────────────────────────────────────────────────────────────
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Core physics & routes
        run: node scripts/selftest.mjs

      - name: Session recording & replay
        run: node scripts/sessiontest.mjs

      - name: GPX conversion
        run: node scripts/gpxtest.mjs

      - name: Cloud sync merge
        run: node scripts/synctest.mjs

      - name: Surface textures & road groups
        run: node scripts/texturetest.mjs

      - name: PWA installability
        run: node scripts/pwatest.mjs

      - name: Biomes & artifacts
        run: node scripts/biometest.mjs

      - name: DOM smoke
        run: node scripts/smoke.mjs

  # ── Deploy to GitHub Pages (main only) ───────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for GitHub Pages
        env:
          VITE_BASE: /BlackMirrorBikeRide/
        run: npm run build

      # Copy index.html → 404.html so the SPA router handles direct URL loads
      - name: Add SPA 404 fallback
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
